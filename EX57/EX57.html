<html>
    <head>
        <title>EX57</title>
        <script>
            function Sum(){
                var total = 0;
                var prc1 = parseFloat(document.getElementById("price1").innerHTML);
                var prc2 = parseFloat(document.getElementById("price2").innerHTML);
                var prc3 = parseFloat(document.getElementById("price3").innerHTML);

                if (myform.qty1.value ==""){
                    myform.qty1.value=0

                }
                if (myform.qty2.value==""){
                    myform.qty2.value=0

                }
                if(myform.qty3.value==""){
                    myform.qty3.value=0
                }
                if (myform.qty1.value >= 0){
                    var qty1 = eval(myform.qty1.value);
                    total += qty1 * prc1;
                    myform.item1.value = (qty1 * prc1).toFixed(2) + "$";
                } else {
                    myform.item1.value = "";
                    alert("Please enter a valid quantity for item 1");
                }
                if (myform.qty2.value >=0){
                    var qty2 = eval(myform.qty2.value);
                    total += qty2 * prc2;
                    myform.item2.value = (qty2 * prc2).toFixed(2) + "$";
                } else {
                    myform.item2.value = "";
                    alert("Please enter a valid quantity for item 2");
                }
                if (myform.qty3.value >= 0){
                    var qty3 = eval(myform.qty3.value);
                    total += qty3 * prc3;
                    myform.item3.value = (qty3 * prc3).toFixed(2) + "$";
                } else {
                    myform.item3.value = "";
                    alert("Please enter a valid quantity for item 3");
                }
                myform.total.value = total.toFixed(2) + "$";
            }
        </script>
    </head>
    <body >
        <form name="myform">
            <table  align="center" style="text-align: center;">
                <tr>
                    <th>
                        Part Number
                    </th>
                    <th>
                        Description
                    </th>
                    <th>
                        Price
                    </th>
                    <th>
                        Qty
                    </th>
                    <th>
                        Item table
                    </th>
                </tr>
                <tr>
                    <td>
                        C112
                    </td>
                    <td>
                        Mouse
                    </td>
                    <td id="price1">
                        19.95$
                    </td>
                    <td>
                        <input type="number" name="qty1" min="1">
                    </td>
                    <td>
                        <input type="text" name="item1" readonly>
                    </td>
                </tr>
                <tr>
                    <td>
                        B124
                    </td>
                    <td>
                        Keyboard US
                    </td>
                    <td id="price2">
                        29.95$
                    </td>
                    <td>
                        <input type="number" name="qty2" min="1">
                    </td>
                    <td>
                        <input type="text" name="item2" readonly>
                    </td>
                </tr>
                <tr>
                    <td>
                        U125
                    </td>
                    <td>
                        USB KingMaxx
                    </td>
                    <td id="price3">
                        39.95$
                    </td>
                    <td>
                        <input type="number" name="qty3" min="1">
                    </td>
                    <td>
                        <input type="text" name="item3" readonly>
                    </td>
                </tr>
                <tr>
                    <td colspan="5" style="text-align: right;">
                        <hr>
                        Total:
                        <input type="text" name="total" readonly>
                        <br>
                        <button type="button" onclick="Sum()" style="background-color: rgb(174, 68, 6); border-color: peru; color:white;">
                            Sum
                        </button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
